prefix: "&eSpec &8» "

# Режим скрытия модератора во время наблюдения:
#   VANISH - при начале спека модератору выдаётся vanish через Essentials API
#            (скрыт из таба и мира; если Essentials нет - обычное скрытие)
#   SILENT - модератор остаётся в табе как обычный игрок в выживании (гм0):
#            без серого выделения и без сортировки в конец списка
visibility:
  mode: VANISH

action-bar:
  enabled: true
  message: "&6⚡ &fВы находитесь в режиме &eневидимости&f."

# Названия звуков должны существовать в вашей версии Minecraft.
sounds:
  enabled: true
  start:
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.3
    pitch: 1.0
  teleport:
    name: ENTITY_ENDERMAN_TELEPORT
    volume: 0.3
    pitch: 1.0
  stop:
    name: ENTITY_PLAYER_SMALL_FALL
    volume: 0.3
    pitch: 1.0
  error:
    name: ENTITY_VILLAGER_NO
    volume: 0.3
    pitch: 1.0
  reload:
    name: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.2
    pitch: 1.0

messages:
  no-permission: "&c☠ &fУ вас нет прав"
  player-only: "бля иди нахуй"
  usage: "&eℹ &fИспользуйте: /spec (игрок)"
  player-not-found: "&c☠ &fИгрок не найден"
  cannot-spec-yourself: "&c☠ &fНельзя наблюдать за самим собой"
  already-spectating: "&c✘ &fВы уже находитесь в режиме наблюдения"
  spec-started: "&e⚡ &fВы начали наблюдение за &e%player%"
  spec-teleported: "&e⚡ &fТелепортация к &e%player%"
  spec-stopped: "&e⭐ &fВы завершили наблюдение"
  target-left: "&eℹ &fИгрок &e%player% &fну как бы &cвышел &fс сервера"
  teleport-failed: "&c☠ &fНе удалось телепортироваться к игроку"
  restored-after-restart: "&e⚡ &fСлежка завершена, из-за &eрестарта"
  reload-success: "&e⭐ &fКонфигурация перезагружена"
  reload-error: "&c☠ &fНе удалось перезагрузить конфигурацию"